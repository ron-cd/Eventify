events {}

http {
    upstream frontend_upstream {
        server frontend:80;
    }

    upstream event_api_upstream {
        server event-api:3000;
    }

    upstream registration_api_upstream {
        server registration-api:3001;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://frontend_upstream/;
            proxy_set_header Host $host;
        }

        location /api/events/ {
            proxy_pass http://event_api_upstream/events/;
            proxy_set_header Host $host;
        }

        location /api/students/ {
            proxy_pass http://event_api_upstream/students/;
            proxy_set_header Host $host;
        }

        # Student registration (create)
        location /api/register/ {
            proxy_pass http://registration_api_upstream/registrations/;
            proxy_set_header Host $host;
        }

        # Admin registration management (view by event, update status)
        location /api/registrations/ {
            proxy_pass http://registration_api_upstream/registrations/;
            proxy_set_header Host $host;
        }

        location /api/admin/ {
            proxy_pass http://event_api_upstream/admin/;
            proxy_set_header Host $host;
        }
    }
}