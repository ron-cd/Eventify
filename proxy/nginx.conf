events {}

http {
    upstream frontend_upstream {
        server frontend:80;
    }

    upstream event_api_upstream {
        server event-api:3000;
    }

    upstream registration_api_upstream {
        server registration-api:3001;
    }

    server {
        listen 80;

        # Frontend — serves the static site
        location / {
            proxy_pass http://frontend_upstream/;
            proxy_set_header Host $host;
        }

        # Event API — events + students (per Phase 7's decision)
        location /api/events/ {
            proxy_pass http://event_api_upstream/events/;
            proxy_set_header Host $host;
        }

        location /api/students/ {
            proxy_pass http://event_api_upstream/students/;
            proxy_set_header Host $host;
        }

        # Registration API
        location /api/register/ {
            proxy_pass http://registration_api_upstream/registrations/;
            proxy_set_header Host $host;
        }
    }
}