<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eventify</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="bg-blobs" aria-hidden="true">
    <span class="bg-blob bg-blob-1"></span>
    <span class="bg-blob bg-blob-2"></span>
    <span class="bg-blob bg-blob-3"></span>
  </div>

  <button id="themeToggleBtn" class="theme-toggle-fixed" aria-label="Toggle dark mode">🌙</button>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-inner">
      <span class="hero-badge">Eventify</span>
      <h1 class="hero-title">Find your next event.<br>Register in seconds.</h1>
      <p class="hero-sub">Browse what's happening around your org — workshops, assemblies, socials, and more.</p>
      <div class="hero-stat" id="heroStat"></div>
    </div>
  </section>

  <main class="site-main">
    <section id="eventListView">
      <div class="list-toolbar">
        <h2>Upcoming Events</h2>
        <input type="search" id="searchInput" placeholder="Search events…" aria-label="Search events" />
      </div>
      <div id="eventList" class="events-bento"></div>
    </section>
  </main>

  <!-- SLIDE-OVER PANEL -->
  <div id="detailsOverlay" class="slideover-overlay hidden"></div>
  <aside id="eventDetailsView" class="slideover hidden" aria-hidden="true">
    <button id="backToListBtn" class="btn-ghost close-slideover" aria-label="Close">✕</button>
    <div id="eventDetails" class="event-detail-content"></div>

    <form id="registrationForm" class="register-card">
      <h2>Register</h2>
      <label for="studentNumberInput">Student Number</label>
      <input type="text" id="studentNumberInput" required placeholder="e.g. 2021-00001" />
      <p id="regFormError" class="field-error visually-hidden" role="alert"></p>
      <button type="submit" id="registerSubmitBtn" class="btn-primary" style="width:100%; margin-top: var(--space-3);">
        <span class="btn-label">Register</span>
      </button>
    </form>
  </aside>

  <!-- CONFIRMATION -->
  <div id="confirmationOverlay" class="slideover-overlay hidden"></div>
  <section id="confirmationView" class="confirmation-popup hidden">
    <div class="confirmation-card">
      <div class="confirmation-badge">✓</div>
      <h2>Registration Confirmed</h2>
      <div id="confirmationDetails"></div>
      <button id="backToListFromConfirmBtn" class="btn-primary" style="margin-top: var(--space-3);">
        View More Events
      </button>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
