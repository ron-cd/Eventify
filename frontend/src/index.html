<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Eventify</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>Eventify</h1>
    <p class="build-label" id="buildLabel">Build dev</p>
  </header>

  <main>
    <section id="eventListView">
      <h2>Upcoming Events</h2>
      <div id="eventList" class="event-list"></div>
    </section>

    <section id="eventDetailsView" class="hidden">
      <button id="backToListBtn">&larr; Back</button>
      <div id="eventDetails"></div>
      <form id="registrationForm">
        <h3>Register</h3>
        <label>
          Student Number
          <input type="text" id="studentNumberInput" required />
        </label>
        <button type="submit">Register</button>
      </form>
    </section>

    <section id="confirmationView" class="hidden">
      <h2>✅ Registration Confirmed</h2>
      <div id="confirmationDetails"></div>
      <button id="backToListFromConfirmBtn">View More Events</button>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
